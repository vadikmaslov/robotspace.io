<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
  <title id="title">RobotSpace system and publication flow</title>
  <desc id="desc">Visitors, developers and administrators use the Next.js web application. Its service layer reads and writes PostgreSQL through Prisma. A worker processes jobs and external sources. Contributions carry evidence to moderation, then a decision updates public pages and notifications.</desc>
  <defs><style>text{font-family:Inter,Arial,sans-serif;fill:#e5e7eb}.box{fill:#171b22;stroke:#536174;stroke-width:2}.accent{fill:#123c38;stroke:#34d399}.admin{fill:#32263d;stroke:#c084fc}.flow{fill:none;stroke:#9aa7b8;stroke-width:2.5;marker-end:url(#a)}.label{font-size:18px;font-weight:600}.sub{font-size:14px;fill:#b4bfcd}.small{font-size:14px;fill:#b4bfcd}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa7b8"/></marker></defs>
  <rect width="1440" height="920" fill="#090b0f"/><text x="64" y="62" font-size="30" font-weight="700">RobotSpace: system and publication flow</text><text x="64" y="92" class="small">Solid arrows show the main data and decision paths. The editorial record, evidence and audit history remain separate.</text>
  <rect class="box" x="70" y="165" width="220" height="98" rx="14"/><text class="label" x="103" y="204">Visitor, developer</text><text class="sub" x="125" y="229">or manufacturer</text>
  <rect class="admin" x="70" y="335" width="220" height="76" rx="14"/><text class="label" x="116" y="380">Administrator</text>
  <rect class="accent" x="430" y="210" width="270" height="126" rx="14"/><text class="label" x="506" y="250">Next.js web app</text><text class="sub" x="462" y="278">public pages, Registry, admin</text><text class="sub" x="489" y="301">server actions</text>
  <rect class="box" x="810" y="180" width="280" height="145" rx="14"/><text class="label" x="855" y="222">Service layer</text><text class="sub" x="843" y="250">authentication, permissions,</text><text class="sub" x="853" y="272">publication rules, evidence</text>
  <rect class="accent" x="1170" y="190" width="205" height="122" rx="14"/><text class="label" x="1210" y="232">PostgreSQL</text><text class="sub" x="1208" y="258">Prisma, catalog,</text><text class="sub" x="1210" y="280">Registry, audit, jobs</text>
  <rect class="box" x="810" y="420" width="280" height="104" rx="14"/><text class="label" x="879" y="460">Worker</text><text class="sub" x="842" y="488">ingestion, GitHub refresh, jobs</text>
  <rect class="box" x="1170" y="420" width="205" height="104" rx="14"/><text class="label" x="1217" y="460">External</text><text class="sub" x="1204" y="487">GitHub, DNS, S3, email</text>
  <path class="flow" d="M290 214H430"/><path class="flow" d="M290 373H380Q405 373 405 335V300H430"/><path class="flow" d="M700 273H810"/><path class="flow" d="M1090 251H1170"/><path class="flow" d="M950 325V420"/><path class="flow" d="M1090 472H1170"/><path class="flow" d="M1170 470H1120Q1090 470 1090 440"/>
  <text x="70" y="600" font-size="24" font-weight="700">Contribution to publication</text>
  <rect class="box" x="70" y="650" width="235" height="110" rx="14"/><text class="label" x="118" y="691">Contribution</text><text class="sub" x="95" y="720">project, claim, correction,</text><text class="sub" x="98" y="742">compatibility report</text>
  <rect class="box" x="405" y="650" width="210" height="110" rx="14"/><text class="label" x="462" y="691">Evidence</text><text class="sub" x="432" y="720">HTTPS source, GitHub</text><text class="sub" x="455" y="742">or DNS proof</text>
  <rect class="admin" x="715" y="650" width="210" height="110" rx="14"/><text class="label" x="745" y="691">Moderation</text><text class="sub" x="749" y="720">accept, reject, audit</text><text class="sub" x="765" y="742">status transition</text>
  <rect class="accent" x="1025" y="650" width="280" height="110" rx="14"/><text class="label" x="1073" y="691">Publication</text><text class="sub" x="1055" y="720">public projection and</text><text class="sub" x="1068" y="742">in-app notification</text>
  <path class="flow" d="M305 705H405"/><path class="flow" d="M615 705H715"/><path class="flow" d="M925 705H1025"/><path class="flow" d="M1165 650V570Q1165 550 1140 550H570Q540 550 540 525V336"/>
  <rect x="70" y="815" width="1235" height="55" rx="10" fill="#11161e" stroke="#2c3542"/><text class="small" x="95" y="848"><tspan font-weight="700" fill="#e5e7eb">Legend:</tspan><tspan> green = application data/publication; purple = human administrative decision; dark = user, worker or external system. Evidence never becomes public solely because it was submitted.</tspan></text>
</svg>
